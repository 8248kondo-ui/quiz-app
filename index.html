<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Quiz Master | 毎日学べるクイズ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.0.2">
    <link rel="stylesheet" href="style-home.css?v=1.0.2">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="container header-content">
            <h1 class="logo" id="logo-btn" style="cursor: pointer;">Quiz<span>Master</span></h1>
            <nav>
                <button id="nav-home" class="nav-btn active">トップ</button>
                <button id="nav-quiz" class="nav-btn">問題</button>
                <button id="nav-learn" class="nav-btn">解説</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 初期画面 (ランディング) -->
        <section id="landing-view" class="view active">
            <div class="landing-container">
                <h2 class="landing-title">学習モードを選択</h2>
                <div class="landing-options">
                    <button id="landing-btn-quiz" class="landing-btn card">
                        <div class="landing-icon">✏️</div>
                        <h3>問題を解く (Quiz)</h3>
                        <p>カレンダーや単元からクイズに挑戦し、実力を試します</p>
                    </button>
                    <button id="landing-btn-learn" class="landing-btn card">
                        <div class="landing-icon">📖</div>
                        <h3>解説を読む (Learn)</h3>
                        <p>各単元のドキュメントを読み、知識を体系的に深めます</p>
                    </button>
                </div>
            </div>
        </section>

        <!-- ホーム画面（クイズ選択） -->
        <section id="home-view" class="view hidden">
            <div class="home-header">
                <h2>コースを選択</h2>
                <div class="view-tabs">
                    <button id="tab-btn-calendar" class="view-tab active">カレンダー</button>
                    <button id="tab-btn-category" class="view-tab">単元別</button>
                </div>
            </div>
            
            <!-- カレンダータブ -->
            <div id="tab-content-calendar" class="tab-content active">
                <p class="tab-description">カレンダーから挑戦する日付を選んでください</p>
                <div id="calendar-container" class="calendar-container card">
                    <div class="calendar-header">
                        <button id="prev-month" class="icon-btn">&lt;</button>
                        <h3 id="calendar-month-title">2026年 5月</h3>
                        <button id="next-month" class="icon-btn">&gt;</button>
                    </div>
                    <div class="calendar-grid" id="calendar-grid">
                        <!-- Javascriptがここにカレンダーを生成します -->
                    </div>
                </div>

                <div id="daily-list" class="daily-grid">
                    <!-- Javascriptがここに選択した日のカードを生成します -->
                </div>
            </div>

            <!-- 単元別タブ -->
            <div id="tab-content-category" class="tab-content hidden">
                <p class="tab-description">挑戦したい単元を選んでください</p>
                <div class="category-tabs">
                    <button class="cat-tab" data-cat="Oracle">Oracle</button>
                    <button class="cat-tab" data-cat="Java">Java</button>
                    <button class="cat-tab" data-cat="Spring">Spring</button>
                    <button class="cat-tab" data-cat="JavaScript">JavaScript</button>
                    <button class="cat-tab" data-cat="総合問題">総合問題</button>
                    <button class="cat-tab" data-cat="ランダム問題">ランダム10問</button>
                </div>
                <div id="category-list" class="daily-grid">
                    <!-- Javascriptがここに選択した単元の問題リストを生成します -->
                </div>
            </div>
        </section>

        <!-- クイズ画面 -->
        <section id="quiz-view" class="view hidden">
            <div class="quiz-header-top">
                <button class="secondary-btn back-to-home-btn">← ホームに戻る</button>
                <h2 id="current-quiz-date" class="date-title">5/1</h2>
            </div>
            
            <div id="quiz-container" class="card">
                <div class="card-header">
                    <span id="question-number" class="badge">Question 1</span>
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>
                
                <div class="card-body">
                    <h2 id="question-text">ここに問題文が表示されます</h2>
                    <div id="options-container" class="options-grid">
                        <!-- オプションがここに動的に生成されます -->
                    </div>
                </div>
            </div>

            <!-- フィードバック画面（モーダル/オーバーレイ） -->
            <div id="feedback-overlay" class="overlay hidden">
                <div class="feedback-card card">
                    <div id="feedback-icon" class="feedback-icon"></div>
                    <h2 id="feedback-title">正解！</h2>
                    <div class="answer-reveal">
                        <p class="label">正解の回答:</p>
                        <p id="correct-answer-text" class="value"></p>
                    </div>
                    <div class="explanation-box">
                        <h3>解説</h3>
                        <p id="explanation-text"></p>
                    </div>
                    <button id="next-btn" class="primary-btn">次へ進む</button>
                </div>
            </div>
        </section>

        <!-- アーカイブ（解説）画面 -->
        <section id="archive-view" class="view hidden">
            <div class="quiz-header-top">
                <button class="secondary-btn back-to-home-btn">← ホームに戻る</button>
                <h2 id="archive-date-title" class="date-title">5/1 の解説</h2>
            </div>
            <div id="archive-list" class="archive-grid">
                <!-- 過去問リストがここに生成されます -->
            </div>
        </section>

        <!-- 完了画面 -->
        <section id="complete-view" class="view hidden">
            <div class="quiz-header-top">
                <button class="secondary-btn back-to-home-btn">← 問題一覧に戻る</button>
            </div>
            <div class="card complete-card">
                <div id="complete-icon" class="celebration-icon">🏆</div>
                <h2 id="complete-title">全問正解！おめでとうございます！</h2>
                <p id="complete-desc">この日の課題をクリアしました。明日も頑張りましょう！</p>
                <button id="restart-btn" class="primary-btn">もう一度挑戦する</button>
                <button id="review-wrong-btn" class="secondary-btn hidden" style="margin-top: 15px;">間違えた問題の解説を見る</button>
            </div>
        </section>

        <!-- 学習画面 (解説) -->
        <section id="learn-view" class="view hidden">
            <div class="learn-container">
                <!-- 左サイドバー -->
                <aside class="learn-sidebar card">
                    <div class="learn-subjects">
                        <button class="subject-tab active" data-subject="Spring">Spring</button>
                        <button class="subject-tab" data-subject="Java">Java</button>
                        <button class="subject-tab" data-subject="Oracle">Oracle</button>
                        <button class="subject-tab" data-subject="JavaScript">JavaScript</button>
                        <button class="subject-tab" data-subject="HTML/CSS">HTML/CSS</button>
                    </div>
                    
                    <div class="learn-progress-container">
                        <div class="progress-header">
                            <span class="progress-label">学習進捗</span>
                            <span id="learn-progress-text">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="learn-progress-fill"></div>
                        </div>
                    </div>

                    <div class="learn-chapters-container">
                        <h3 class="sidebar-title">目次</h3>
                        <div class="learn-chapters" id="learn-chapters-list">
                            <!-- JSで動的に章のリストを生成します -->
                            <p class="tab-description">準備中...</p>
                        </div>
                    </div>
                </aside>

                <!-- 右メインコンテンツ -->
                <article class="learn-content card" id="learn-main-content">
                    <button id="learn-back-btn" class="learn-back-btn">← 目次に戻る</button>
                    <h2 id="learn-chapter-title">章を選択してください</h2>
                    <div id="learn-chapter-body" class="markdown-body">
                        <p class="placeholder-text">左側の目次から学習したいトピックを選んでください。</p>
                    </div>
                    
                    <!-- アクションエリア -->
                    <div class="learn-chapter-actions hidden" id="learn-chapter-actions">
                        <button id="mark-read-btn" class="primary-btn read-btn">✅ この章を読み終えた</button>
                    </div>
                    
                    <!-- ナビゲーション -->
                    <div class="learn-navigation hidden" id="learn-navigation">
                        <button id="prev-chapter-btn" class="nav-btn-outline">＜ 前の章へ</button>
                        <button id="next-chapter-btn" class="nav-btn-outline">次の章へ ＞</button>
                    </div>
                    
                    <!-- クイズへジャンプ -->
                    <div class="learn-quiz-action hidden" id="learn-quiz-action-container">
                        <button id="jump-to-quiz-btn" class="primary-btn pulse-anim">✏️ この単元のクイズに挑戦する</button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 QuizMaster. Daily Learning.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="questions.js?v=1.0.2"></script>
    <script src="learn_data.js?v=1.0.2"></script>
    <script src="app.js?v=1.0.2"></script>
</body>
</html>
